name: iOS build
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check web bridge
        run: node --test tests/clipboard.test.mjs ios/tests/native-bridge.test.mjs
      - name: Generate and validate Xcode project
        run: |
          python3 ios/generate_project.py
          python3 ios/validate_project.py
          python3 -m unittest discover -s ios/tests -p 'test_*.py'
          bash -n ios/Install-PrivMsg.command
          bash -n ios/tools/verify_simulator_bundle.sh
      - name: Compile for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/PrivMsg.xcodeproj -scheme PrivMsg -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PrivMsgDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify Simulator bundle and ad hoc signature
        run: |
          bash ios/tools/verify_simulator_bundle.sh \
            "$RUNNER_TEMP/PrivMsgDerivedData/Build/Products/Debug-iphonesimulator/PrivMsg.app"
      - name: Launch on iPhone Simulator
        run: |
          bash ios/tools/simulator_smoke.sh \
            "$RUNNER_TEMP/PrivMsgDerivedData/Build/Products/Debug-iphonesimulator/PrivMsg.app" \
            "$RUNNER_TEMP/privmsg-smoke.png"
      - name: Save launch screenshot for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privmsg-launch
          path: ${{ runner.temp }}/privmsg-smoke.png
          if-no-files-found: ignore
          retention-days: 3
